registry:
  id: skills
  version: 0.2.0
  status: draft
  purpose: >
    Catálogo portable de conocimientos operativos. Cada SKILL.md define el
    procedimiento; este registro declara su ámbito, dependencias, límites y
    roles habilitados.

selection_policy:
  domain_skill: >
    Una skill de dominio interpreta evidencia dentro de una metodología técnica.
    Puede proponer análisis y hallazgos, pero no aprueba ni emite externamente.
  transversal_skill: >
    Una skill transversal transforma, controla o presenta información. No toma
    decisiones de ingeniería ni reemplaza al rol responsable.
  composition: >
    El orquestador selecciona una skill de dominio según el work item y le
    habilita las skills transversales necesarias. Las dependencias no autorizan
    omitir revisiones independientes.
  status_meaning:
    draft: Redactada, aún sin ensayo de aceptación controlado.
    validated: Ensayada contra casos de prueba definidos y apta para uso controlado.
    planned: Registrada para diseño futuro; no puede activarse.

skills:
  - id: analyze-grounding-report
    name: Análisis de informe de verificación P.A.T.
    kind: domain
    status: draft
    version: 0.2.0
    path: skills/analyze-grounding-report/SKILL.md
    domains:
      - electrical-grounding
      - technical-reporting
    applicable_workflows:
      - grounding-report
    invocable_by:
      - orchestrator
      - domain_specialist
      - technical_reviewer
    required_inputs:
      - work_item
      - input_manifest
      - current_campaign_evidence
      - definition_of_done
    optional_inputs:
      - master_template
      - approved_historical_reports
      - normative_sources
      - design_specifications
    produces:
      - validated_control_matrix
      - evidence_records
      - technical_findings
      - limitations_record
      - provisional_evaluation_states
      - pending_items_list
    uses_skills:
      - validate-spreadsheet-input
      - manage-photo-evidence-gallery
      - validate-technical-traceability
      - research-normative-criterion
      - critique-grounding-safety-analysis
    requires_tools:
      - workspace_artifact_store
      - spreadsheet_processor
      - image_evidence_inspector
      - source_research
    boundaries:
      - La evidencia actual prevalece sobre históricos y referencias.
      - No inventa lecturas, criterios, configuraciones ni conclusiones.
      - No aprueba el resultado ni ensambla el informe final.
      - Sin evidencia o criterio suficiente usa Pendiente o No concluyente.
    validation:
      - Cada lectura se vincula a evidencia o queda pendiente.
      - Cada estado Conforme o No conforme tiene criterio verificable.
      - Sus salidas cumplen los contratos de evidencia y finding.

  - id: validate-spreadsheet-input
    name: Validación de matrices y hojas de cálculo
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/validate-spreadsheet-input/SKILL.md
    domains:
      - data-quality
      - technical-reporting
    invocable_by:
      - domain_specialist
      - technical_reviewer
      - integrator
    required_inputs:
      - source_spreadsheet
      - expected_structure_or_work_item
    produces:
      - normalized_table
      - spreadsheet_validation_record
      - data_quality_issues
    requires_tools:
      - workspace_artifact_store
      - spreadsheet_processor
    boundaries:
      - Valida estructura y datos visibles; no evalúa aceptación técnica.
      - No modifica el archivo fuente ni redondea mediciones.
      - No crea valores para completar celdas faltantes.

  - id: manage-photo-evidence-gallery
    name: Gestión de galería de evidencias fotográficas
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/manage-photo-evidence-gallery/SKILL.md
    domains:
      - evidence-management
      - visual-quality
    invocable_by:
      - domain_specialist
      - integrator
      - visual_reviewer
    required_inputs:
      - photo_artifacts
      - evidence_mapping_or_matrix
    produces:
      - evidence_gallery
      - visual_evidence_assessments
      - photo_issue_list
    requires_tools:
      - workspace_artifact_store
      - image_evidence_inspector
      - document_renderer
    boundaries:
      - Comprueba evidencia visual; no interpreta ingeniería.
      - No infiere texto, valor o identidad que no pueda verificarse.
      - No altera el original sin corrección registrada.

  - id: validate-technical-traceability
    name: Validación de trazabilidad técnica
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/validate-technical-traceability/SKILL.md
    domains:
      - traceability
      - quality-assurance
    invocable_by:
      - domain_specialist
      - technical_reviewer
      - auditor
    required_inputs:
      - evidence_records
      - findings
      - criteria_records
    produces:
      - traceability_map
      - traceability_review_record
      - unresolved_links
    requires_tools:
      - workspace_artifact_store
    boundaries:
      - Verifica enlaces entre registros; no crea evidencia ni criterios.
      - No resuelve una falta de evidencia mediante suposición.

  - id: research-normative-criterion
    name: Investigación de criterio normativo
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/research-normative-criterion/SKILL.md
    domains:
      - normative-research
      - technical-compliance
    invocable_by:
      - normative_researcher
      - technical_reviewer
      - auditor
    required_inputs:
      - criterion_request
      - technical_context
    produces:
      - source_record
      - normative_citation
      - applicability_assessment
    requires_tools:
      - workspace_artifact_store
      - source_research
    boundaries:
      - Registra fuente, edición, cláusula y aplicabilidad.
      - No atribuye límites genéricos ni declara cumplimiento por analogía.
      - Si la fuente no es verificable, conserva el criterio como pendiente.

  - id: critique-grounding-safety-analysis
    name: Crítica de ingeniería eléctrica en verificaciones P.A.T.
    kind: domain
    status: draft
    version: 0.1.0
    path: skills/critique-grounding-safety-analysis/SKILL.md
    domains:
      - electrical-grounding
      - engineering-critique
    applicable_workflows:
      - grounding-report
    invocable_by:
      - domain_specialist
      - technical_reviewer
      - auditor
    required_inputs:
      - validated_control_matrix
      - technical_findings_or_draft
      - criteria_register
    produces:
      - technical_critique_record
    requires_tools:
      - workspace_artifact_store
    boundaries:
      - No inventa estudios, datos o mediciones no provistos; los marca como faltantes.
      - No sustituye la verificación de fuente/edición/cláusula de research-normative-criterion.
      - En modo auditoría no rehace el análisis técnico ni emite juicio de ingeniería propio.
      - Declarar sin hallazgos solo es válido si cada pregunta aplicable fue respondida explícitamente.
    validation:
      - domain_specialist y technical_reviewer registran un technical_critique_record propio y separado.
      - technical_reviewer llega a su conclusión antes de leer la del especialista.
      - auditor verifica que ambos registros existen y están razonados, no solo que existen.

  - id: write-document-from-template
    name: Ensamblaje de documento desde plantilla
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/write-document-from-template/SKILL.md
    domains:
      - document-production
    invocable_by:
      - integrator
    required_inputs:
      - approved_content
      - template
      - artifact_references
    produces:
      - word_report_draft
      - integration_record
    requires_tools:
      - workspace_artifact_store
      - document_processor
    boundaries:
      - Inserta contenido aprobado respetando la plantilla.
      - No altera hallazgos, estados, datos ni conclusiones aprobadas.
      - No aprueba ni distribuye el documento.

  - id: render-and-review-document
    name: Renderizado y revisión visual documental
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/render-and-review-document/SKILL.md
    domains:
      - visual-quality
      - document-production
    invocable_by:
      - integrator
      - visual_reviewer
    required_inputs:
      - word_report_draft
      - report_manifest_or_artifact_list
    produces:
      - rendered_document
      - visual_qa_record
      - visual_correction_request
    requires_tools:
      - workspace_artifact_store
      - document_renderer
      - image_evidence_inspector
    boundaries:
      - Evalúa presentación, orden, orientación y legibilidad.
      - No valida la corrección técnica de una conclusión.
      - No modifica el Word sin corrección y trazabilidad registradas.

  # --- Equipo de presentaciones (workflow: presentation-deck) ---

  - id: design-presentation-narrative
    name: Diseño de narrativa de presentación
    kind: domain
    status: draft
    version: 0.1.0
    path: skills/design-presentation-narrative/SKILL.md
    domains:
      - presentation-design
      - content-strategy
    applicable_workflows:
      - presentation-deck
    invocable_by:
      - orchestrator
      - content_strategist
      - narrative_reviewer
    required_inputs:
      - work_item
      - source_content
      - definition_of_done
    optional_inputs:
      - audience_profile
      - prior_decks
      - brand_guideline
    produces:
      - slide_outline
      - key_messages
      - content_gap_list
      - technical_critique_record
    uses_skills:
      - critique-presentation-effectiveness
    requires_tools:
      - workspace_artifact_store
      - document_processor
    boundaries:
      - No inventa cifras, resultados ni citas.
      - No decide paleta, tipografía ni maquetación.
      - No aprueba su propia narrativa como definitiva.
    validation:
      - Cada mensaje clave se vincula a contenido fuente o queda pendiente.
      - Cada slide propuesta tiene un solo mensaje.
      - Sus salidas cumplen los contratos de finding y handoff.

  - id: critique-presentation-effectiveness
    name: Crítica de efectividad de presentación
    kind: domain
    status: draft
    version: 0.1.0
    path: skills/critique-presentation-effectiveness/SKILL.md
    domains:
      - presentation-design
      - communication-critique
    applicable_workflows:
      - presentation-deck
    invocable_by:
      - content_strategist
      - narrative_reviewer
      - auditor
    required_inputs:
      - slide_outline_or_draft
      - approved_source_content
    optional_inputs:
      - refined_headlines
      - refined_ctas
    produces:
      - technical_critique_record
    requires_tools:
      - workspace_artifact_store
    boundaries:
      - No inventa contenido, cifras o fuentes faltantes; las marca como pendientes.
      - No sustituye la revisión visual del renderizado.
      - En modo auditoría no rehace la crítica ni emite juicio propio de efectividad.
      - Declarar sin hallazgos solo es válido si cada pregunta aplicable fue respondida explícitamente.
    validation:
      - content_strategist y narrative_reviewer registran un technical_critique_record propio y separado.
      - narrative_reviewer llega a su conclusión antes de leer la del estratega.
      - auditor verifica que ambos registros existen y están razonados, no solo que existen.

  - id: apply-visual-identity-system
    name: Aplicación de sistema de identidad visual
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/apply-visual-identity-system/SKILL.md
    domains:
      - visual-design
      - brand-consistency
    invocable_by:
      - visual_designer
    required_inputs:
      - slide_outline
      - brand_guideline_or_default_criteria
    optional_inputs:
      - available_visual_material
    produces:
      - visual_system_spec
      - brand_source_record
    requires_tools:
      - workspace_artifact_store
    boundaries:
      - No modifica mensajes, datos ni estructura narrativa aprobada.
      - No decide contenido persuasivo.
      - Sin guía de marca ni criterio por defecto aplicable, lo declara pendiente en vez de inventar una paleta.

  - id: write-persuasive-copy
    name: Redacción de copy persuasivo
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/write-persuasive-copy/SKILL.md
    domains:
      - marketing-copy
      - persuasion
    invocable_by:
      - marketing_copywriter
    required_inputs:
      - slide_outline
      - key_messages
      - audience_and_decision_sought
    produces:
      - refined_headlines
      - refined_ctas
      - positioning_notes
      - unsupported_claims_flagged
    requires_tools:
      - workspace_artifact_store
    boundaries:
      - Solo la invoca marketing_copywriter, y solo cuando el propósito persuasivo está declarado.
      - No inventa cifras, resultados ni promesas no sustentadas.
      - No decide estructura narrativa ni sistema visual.

  - id: assemble-pptx-deck
    name: Ensamblaje de presentación PPTX
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/assemble-pptx-deck/SKILL.md
    domains:
      - document-production
      - presentation-design
    invocable_by:
      - integrator
    required_inputs:
      - approved_narrative
      - visual_system_spec
    optional_inputs:
      - refined_headlines
      - refined_ctas
      - available_visual_material
    produces:
      - pptx_deck
      - integration_record
    requires_tools:
      - workspace_artifact_store
      - presentation_processor
    boundaries:
      - Solo la invoca el integrador.
      - No altera mensajes, cifras, estructura ni sistema visual aprobados.
      - No aprueba ni distribuye la presentación.

  - id: render-and-review-presentation
    name: Renderizado y revisión visual de presentación
    kind: transversal
    status: draft
    version: 0.1.0
    path: skills/render-and-review-presentation/SKILL.md
    domains:
      - visual-quality
      - presentation-design
    invocable_by:
      - integrator
      - visual_reviewer
    required_inputs:
      - pptx_deck
      - visual_system_spec
    produces:
      - rendered_presentation
      - visual_qa_record
      - visual_correction_request
    requires_tools:
      - workspace_artifact_store
      - presentation_renderer
    boundaries:
      - Evalúa presentación, consistencia visual y legibilidad; no valida la narrativa ni el copy.
      - No modifica el PPTX sin corrección y trazabilidad registradas.
      - No aprueba emisión si el sistema visual aprobado no se respeta de forma consistente.

  - id: analyze-comtrade-event
    name: Análisis de evento COMTRADE
    kind: domain
    status: planned
    version: 0.0.0
    path: skills/analyze-comtrade-event/SKILL.md
    domains:
      - power-protection
      - disturbance-analysis
    applicable_workflows:
      - comtrade-diagnosis
    invocable_by:
      - orchestrator
      - domain_specialist
      - technical_reviewer
    boundaries:
      - No puede activarse hasta contar con procedimiento, contratos y evaluación propios.
